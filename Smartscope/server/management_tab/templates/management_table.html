
<div id="container" class="d-flex flex-column p-2" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
<div class="d-flex align-items-center justify-content-between pt-2 pb-1">
    <h4 class="m-0">Archive Browser</h4>
    {% if isArchive %}
    <div class="d-flex align-items-center gap-2">
        <button id="toggleSelectBtn" class="btn btn-sm btn-outline-primary">Select Entries to Export</button>
        <div class="btn-group">
          <button id="exportSelectedBtn" type="button" class="btn btn-sm btn-success dropdown-toggle d-none"
                  data-bs-toggle="dropdown" aria-expanded="false">Export Selected (0)</button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a id="exportWithHmBtn" class="dropdown-item" href="#">With high-mag images</a></li>
            <li><a id="exportNoHmBtn" class="dropdown-item" href="#">Without high-mag images</a></li>
          </ul>
        </div>
        <button id="clearSelectionBtn" class="btn btn-sm btn-outline-secondary d-none">Clear</button>
    </div>
    {% endif %}
</div>
<div id="data-grid" style="flex: 1; width: 100%; min-height: 0;" class="ag-theme-balham"></div>
</div>
<script type="text/javascript" charset="utf-8">
(function() {
    // formats "2024-01-15T10:30:00Z" to "2024-01-15 10:30"
function formatDate(params) {
    if (!params.value) return "";
    var d = new Date(params.value);
    return d.toLocaleString("en-CA", { localeMatcher: "lookup", hour12: false });
}

// renders session name as a clickable link
function sessionLinkRenderer(params) {
    if (!params.value) return "";
    var data = params.data;
    var url = `/smartscope/browse/?group=${data.group_id}&session_id=${data.session_id}&grid_id=${data.grid_id}`;
    return `<a href="${url}" target="_blank">${params.value}</a>`;
}

var textFilter = {
    suppressAndOrCondition: true,
    filterOptions: ["contains", "equals"],
};

var dateFilter = {
    suppressAndOrCondition: true,
    filterOptions: ["equals", "greaterThan", "lessThan"],
};

var numberFilter = {
    suppressAndOrCondition: true,
    filterOptions: ["equals", "greaterThan", "lessThan"],
};
{% if isArchive %}
var columnDefs = [
    {headerName: "", colId: "__select", width: 44, minWidth: 44, maxWidth: 44,
     pinned: "left", sortable: false, filter: false, resizable: false, hide: true,
     cellRenderer: selectionRenderer,
     cellStyle: {display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0}},
    {headerName: "Session", field: "session_label", filter: "agTextColumnFilter", cellRenderer: sessionLinkRenderer},
    {headerName: "Grid", field: "grid_name", filter: "agTextColumnFilter", filterParams: textFilter},
    {headerName: "Date", field: "date", filter: "agTextColumnFilter", filterParams: textFilter},
    {headerName: "Microscope", field: "microscope", filter: "agTextColumnFilter", filterParams: textFilter},
    {headerName: "Detector", field: "detector", filter: "agTextColumnFilter", filterParams: textFilter},
    {headerName: "HoleType", field: "holeType", filter: "agTextColumnFilter", filterParams: textFilter},
    {headerName: "SessionType", field: "session_type", filter: "agTextColumnFilter"},
    {headerName: "Status", field: "status", filter: "agTextColumnFilter", filterParams: textFilter},
    {headerName: "#SquaresAcquired", field: "squares_acquired", filter: "agNumberColumnFilter", filterParams: numberFilter},
    {headerName: "#HolesAcquired", field: "holes_acquired", filter: "agNumberColumnFilter", filterParams: numberFilter},
    {headerName: 'GridQuality', field: "grid_quality", filter: "agTextColumnFilter", filterParams: textFilter},
];
{% else %}
var columnDefs = [
    {headerName: "Session", field: "session_label", filter: "agTextColumnFilter", cellRenderer: sessionLinkRenderer},
    {headerName: "Group", field: "group", filter: "agTextColumnFilter", filterParams: textFilter},
    {headerName: "StartTime", field: "creation_time", filter: "agTextColumnFilter", valueFormatter: formatDate, filterParams: dateFilter},
    {headerName: "EndTime", field: "last_update", filter: "agTextColumnFilter", valueFormatter: formatDate, filterParams: dateFilter},
    {headerName: "Microscope", field: "microscope", filter: "agTextColumnFilter", filterParams: textFilter},
    {headerName: "User", field: "user", filter: "agTextColumnFilter"},
    {headerName: "SessionType", field: "session_type", filter: "agTextColumnFilter"},
    {headerName: "#Grids", field: "grid_count", filter: "agNumberColumnFilter", filterParams: numberFilter},
    {headerName: "#Grids.Good", field: "grid_good", filter: "agNumberColumnFilter", filterParams: numberFilter},
    {headerName: "#Grids.Bad", field: "grid_bad", filter: "agNumberColumnFilter", filterParams: numberFilter},
];
{% endif %}
var gridOptions = {
    columnDefs: columnDefs,
    defaultColDef: {
        filterParams: {suppressAndOrCondition: true, filterOptions: ["contains"]},
        resizable: true,
        enableCellTextSelection: true,
    },
    enableCellTextSelection: true,
    rowModelType: "infinite",
    rowClassRules: {
        'export-selected': function (params) {
            return !!(params.data && selectedGrids.has(params.data.grid_id));
        }
    },
    cacheBlockSize: 100,
    maxBlocksInCache: 10,
    datasource: {
        getRows: function(params) {
            var filtering = encodeURIComponent(JSON.stringify(params.filterModel));
            var sorting = encodeURIComponent(JSON.stringify(params.sortModel));
            //var url = `/sessions_history/sessions/?startRow=${params.startRow}&endRow=${params.endRow}&filter=${filtering}&sort=${sorting}`;
            var dataUrl = {{ isArchive|yesno:"true,false" }} ? "/sessions_history/grids/" : "/sessions_history/sessions/";
            var url = `${dataUrl}?startRow=${params.startRow}&endRow=${params.endRow}&filter=${filtering}&sort=${sorting}`;
            fetch(url)
                .then((response) => response.json())
                .then((data) => {
                    params.successCallback(data.rows, data.totalRows);
                })
                .catch(() => {
                    params.failCallback();
                });
        }
    }
};

var gridDiv = document.querySelector("#data-grid");
var gridApi = agGrid.createGrid(gridDiv, gridOptions);

var toggleBtn = document.getElementById('toggleSelectBtn');
if (toggleBtn) {
    toggleBtn.addEventListener('click', function () {
        selectionMode = !selectionMode;
        gridApi.setColumnsVisible(['__select'], selectionMode);
        toggleBtn.textContent = selectionMode ? 'Done selecting' : 'Select Entries to Export';
        toggleBtn.classList.toggle('btn-outline-primary', !selectionMode);
        toggleBtn.classList.toggle('btn-primary', selectionMode);
        document.getElementById('exportSelectedBtn').classList.toggle('d-none', !selectionMode);
        document.getElementById('clearSelectionBtn').classList.toggle('d-none', !selectionMode);
        gridApi.sizeColumnsToFit();
    });
        document.getElementById('exportWithHmBtn').addEventListener('click', function (e) {
        e.preventDefault();
        exportSelected(true);
    });
    document.getElementById('exportNoHmBtn').addEventListener('click', function (e) {
        e.preventDefault();
        exportSelected(false);
    });

    document.getElementById('clearSelectionBtn').addEventListener('click', function () {
        selectedGrids.clear();
        updateExportButton();
        gridApi.redrawRows();
    });
}

async function exportSelected(includeHighmag = true) {
    await exportGrids([...selectedGrids], includeHighmag, document.getElementById('exportSelectedBtn'));
    updateExportButton();
}

setTimeout(() => gridApi.sizeColumnsToFit(), 100);

var selectedGrids = new Set();
var selectionMode = false;

function updateExportButton() {
    var btn = document.getElementById('exportSelectedBtn');
    if (btn) btn.textContent = `Export Selected (${selectedGrids.size})`;
}

function selectionRenderer(params) {
    if (!params.data) return '';
    var id = params.data.grid_id;

    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;width:100%;';

    var input = document.createElement('input');
    input.type = 'checkbox';
    input.className = 'form-check-input';
    input.style.cssText = 'margin:0;cursor:pointer;float:none;vertical-align:middle;';
    input.checked = selectedGrids.has(id);
    input.addEventListener('change', function () {
        if (input.checked) selectedGrids.add(id); else selectedGrids.delete(id);
        updateExportButton();
        gridApi.redrawRows({ rowNodes: [params.node] });
    });

    wrap.appendChild(input);
    return wrap;
}
})();
</script>
<style>
.ag-theme-balham a {
    color: #222;
    text-decoration: none;
}
.ag-theme-balham a:hover {
    color: #555;
    text-decoration: underline;
}
.badge-cell {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.5;
}

.ag-theme-balham .ag-cell[col-id="__select"] {
    padding: 0 !important;
    line-height: normal !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
}
.ag-theme-balham .ag-cell[col-id="__select"] input[type="checkbox"] {
    margin: 0 !important;
}
</style>
